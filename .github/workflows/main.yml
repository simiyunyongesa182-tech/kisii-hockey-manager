name: Kisii Hockey Manager CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      
      - name: Check PHP files
        run: |
          echo "Checking all PHP files for Kisii Hockey Manager..."
          find . -name "*.php" -exec php -l {} \;
          echo "Build OK - Ready for deploy!"
